<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Mark Turos</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
  /* Self-contained: GitHub Pages serves this file at any missing path, so relative asset links would break. */
  :root { color-scheme: dark; --bg: #0b0d12; --fg: #e9ebf1; --fg-2: #a7aebe; --fg-3: #6e7689; --line: #343c4e; --signal: #ffb547; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f3f4f7; --fg: #10131a; --fg-2: #4a5162; --fg-3: #737a8d; --line: #c8cdd8; --signal: #a85e00; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Instrument Sans", system-ui, sans-serif; }
  main { width: 100%; max-width: 760px; padding: 48px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .label { display: flex; align-items: center; gap: 10px; margin: 0; font: 500 11px/1.4 "Martian Mono", ui-monospace, monospace; font-stretch: 87.5%; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
  .label::before { content: ""; width: 16px; height: 1px; background: var(--signal); }
  h1 { margin: 18px 0 20px; font: 700 clamp(2.6rem, 8vw, 4.6rem)/.98 "Bricolage Grotesque", "Arial Narrow", sans-serif; font-stretch: 84%; letter-spacing: -.024em; text-wrap: balance; }
  h1 span { color: var(--signal); }
  p { max-width: 52ch; margin: 0 0 32px; font-size: 1.125rem; line-height: 1.55; color: var(--fg-2); }
  code { font: 500 .95em "Martian Mono", ui-monospace, monospace; font-stretch: 87.5%; color: var(--fg); }
  a { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 500; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="label">Error 404</p>
  <h1>Nothing stored at offset <span>0x194</span>.</h1>
  <p>404 in hex is <code>0x194</code>, and there's no page at this address. The link may be old, or the page may have moved.</p>
  <a href="/" id="home">Back to the homepage</a>
</main>
<script>
  // Project sites live under /<repo>/; send people to that root instead of the domain root.
  (function () { var seg = location.pathname.split('/').filter(Boolean); if (location.hostname.endsWith('github.io') && seg.length) document.getElementById('home').href = '/' + seg[0] + '/'; })();
</script>
</body>
</html>
